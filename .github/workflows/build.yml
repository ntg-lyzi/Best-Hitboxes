name: Build Best Hitboxes (all versions)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.11"
            java: "25"
            gradle: "9.4.0"
          - mc: "26.1.2"
            java: "25"
            gradle: "9.7.0"
          - mc: "26.2"
            java: "25"
            gradle: "9.7.0"
          - mc: "26.3"
            java: "25"
            gradle: "9.7.0"
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build
        working-directory: versions/${{ matrix.mc }}
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log

      - name: Show errors (only when the build fails)
        if: failure()
        working-directory: versions/${{ matrix.mc }}
        shell: bash
        run: |
          {
            echo "## Minecraft ${{ matrix.mc }} - build errors"
            echo '```'
            grep -E -A4 "error:|What went wrong|Execution failed" build.log | head -250
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "================ ERRORS ================"
          grep -E -A4 "error:|What went wrong|Execution failed" build.log | head -250

      - name: Upload build log (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-mc${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: best-hitboxes-mc${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
